<!DOCTYPE html>
<html>
<head>
    <title>Telugu MovieApp</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🎬 Telugu MovieApp</h1>
            <p>Discover legendary Telugu cinema and blockbuster movies.</p>

            <div class="search-box">
                🔍
                <input
                    type="text"
                    id="search"
                    placeholder="Search movie, actor or director..."
                >
            </div>
        </header>

        <div class="stats">

            <div class="stat-card">
                <h2 id="movieCount">0</h2>
                <p>Movies</p>
            </div>

            <div class="stat-card">
                <h2 id="teluguCount">0</h2>
                <p>Telugu Films</p>
            </div>

            <div class="stat-card">
                <h2>⭐</h2>
                <p>Top Cinema</p>
            </div>

        </div>

        <div class="movie-heading">
            <h2>Movies</h2>
            <span id="totalMovies">0 Movies</span>
        </div>

        <div id="movies" class="movie-container"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
